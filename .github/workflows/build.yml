name: Build GBA ROM
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Build ROM
        run: |
          export PATH=/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:$PATH
          make
      - uses: actions/upload-artifact@v4
        with:
          name: pkstorage-gba
          path: pkstorage.gba
